# Nginx reverse proxy for Mumbai VPS (routes CRM/REST to :8000 and Real-Time Voice WS Engine to :8001)
# Replace voice.yourdomain.com / engine.yourdomain.com with your actual DNS domain and run Certbot for TLS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pontis_api_upstream {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream pontis_engine_upstream {
    server 127.0.0.1:8001;
    keepalive 64;
}

server {
    listen 80;
    server_name voice.yourdomain.com;

    # Allow large CSV lead imports if needed
    client_max_body_size 10m;

    # Real-Time Voice WebSockets (Browser + Vobiz/Exotel/Twilio SIP Media Streams)
    location /ws/ {
        proxy_pass http://pontis_engine_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical for low-latency audio streaming & long active calls
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        tcp_nodelay on;
    }

    location /api/engine/ {
        proxy_pass http://pontis_engine_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # CRM Dashboard, Simulator UI & REST API
    location / {
        proxy_pass http://pontis_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
