services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pontis-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB_PATH: /app/data/telecalling.db
      ENGINE_WS_URL: ${ENGINE_WS_URL:-}
      FORCE_IPV4: "true"
    volumes:
      - ../data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      uvicorn simulator.app:app
      --host 0.0.0.0
      --port 8000
      --workers 1
      --proxy-headers
      --forwarded-allow-ips='*'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/config"]
      interval: 15s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: pontis-engine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DB_PATH: /app/data/telecalling.db
      FORCE_IPV4: "true"
    volumes:
      - ../data:/app/data
    ports:
      - "127.0.0.1:8001:8001"
    command: >
      uvicorn engine.server:app
      --host 0.0.0.0
      --port 8001
      --workers 1
      --ws-ping-interval 20
      --ws-ping-timeout 20
      --proxy-headers
      --forwarded-allow-ips='*'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
